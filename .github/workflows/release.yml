name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  attestations: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check plugin syntax
        run: node --check main.js

      - name: Run tests
        run: node --test

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      # main is only updated through pull requests, so the version bump
      # travels as a pull request and the release is published once it is
      # merged and the manifest carries the release version.
      - name: Check whether the version bump has landed
        id: state
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          CURRENT=$(node -p "require('./manifest.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the version bump pull request
        if: steps.state.outputs.publish == 'false'
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/release-v${VERSION}"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != "0" ]; then
            echo "::notice::a pull request for $BRANCH is already open"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          VERSION="$VERSION" node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const path = "manifest.json";
            const manifest = JSON.parse(await readFile(path, "utf8"));
            manifest.version = process.env.VERSION;
            await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          git commit -am "chore(release): v${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore(release): v${VERSION}" --body "Bumps \`manifest.json\` to v${VERSION}. The release workflow publishes the release once this pull request is merged."
          gh pr merge --auto --squash "$BRANCH"

      - name: Create GitHub release
        if: steps.state.outputs.publish == 'true'
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.gitversion.outputs.majorMinorPatch }}
          target_commitish: main
          name: ${{ steps.gitversion.outputs.majorMinorPatch }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json

      - name: Publish GitHub release
        if: steps.state.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.release.outputs.id }},
              draft: false,
            });

      - name: Attest release assets
        if: steps.state.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
