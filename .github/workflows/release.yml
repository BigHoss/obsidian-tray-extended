name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Update plugin manifest
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const path = "manifest.json";
            const manifest = JSON.parse(await readFile(path, "utf8"));
            manifest.version = process.env.VERSION;
            await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated manifest version
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          if git diff --quiet -- manifest.json; then
            exit 0
          fi
          git add manifest.json
          git commit -m "chore(release): v${VERSION}"
          git push origin HEAD:main

      - name: Synchronize release source
        run: git pull --ff-only origin main

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.gitversion.outputs.majorMinorPatch }}
          target_commitish: main
          name: ${{ steps.gitversion.outputs.majorMinorPatch }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json

      - name: Publish GitHub release
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.release.outputs.id }},
              draft: false,
            });

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
