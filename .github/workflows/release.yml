name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check plugin syntax
        run: node --check main.js

      - name: Run tests
        run: node --test

      # main is only updated through pull requests and the ruleset requires
      # code scanning results before a commit may be pushed to it, so the
      # workflow never writes to main. The version in manifest.json is the
      # version to release: bump it in the pull request that carries the
      # change and the release is published from that merge.
      - name: Read the release version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that the version was already released
        if: steps.version.outputs.released == 'true'
        run: |
          {
            echo "::warning title=No release published::manifest.json still carries v${{ steps.version.outputs.version }}, which was released already. Bump the version in manifest.json to publish this merge."
            echo "Latest tag: $(git tag --sort=-v:refname | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: steps.version.outputs.released == 'false'
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: main
          name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json

      - name: Publish GitHub release
        if: steps.version.outputs.released == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.release.outputs.id }},
              draft: false,
            });

      - name: Attest release assets
        if: steps.version.outputs.released == 'false'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
